# ================================
# TENDER AUTOMATION ENGINE CONFIG
# ================================

# Absolute paths on your Mac
paths:
  master_root: "/Users/lazolasonqishe/Documents/MASTER/"
  tenders_root: "/Users/lazolasonqishe/Documents/MASTER/TENDERS/"
  tender_log_excel: "/Users/lazolasonqishe/Documents/MASTER/TENDERS/01_Tender_Log/Tender_Dashboard_v2.xlsx"
  active_tenders: "/Users/lazolasonqishe/Documents/MASTER/TENDERS/02_Active_Tenders/"
  output_dir: "/Users/lazolasonqishe/Documents/MASTER/TENDERS/00_System/04_Automation/output/"
  log_file: "/Users/lazolasonqishe/Documents/tender-intelligence/logs/scraper.log"

# Scraper settings
scrapers:
  enable_selenium: true    # Enable Selenium-based scrapers (National Treasury)
  timeout: 15
  user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
  
  # Search terms for National Treasury
  search_terms:
    - "mexel"
    - "mexel 432"
    - "mexel432"
    - "mexsteam"
    - "mexsteam 100"
    - "mexel energy sustain"
    - "mexel energy"
    - "tes"
  
  # URLs
  urls:
    national_treasury: "https://www.etenders.gov.za/"

# Classification settings
classification:
  mexel_only: true          # Mexel Energy Sustain (TES product) only

# Excel sheet names
excel:
  tender_log_sheet: "Tender_Log"

# Scoring engine weights
scoring:
  fit_weight: 0.30
  industry_weight: 0.25
  risk_weight: 0.20
  revenue_weight: 0.25
  
  # Priority thresholds
  high_threshold: 7.0
  medium_threshold: 4.5

# Email settings (for daily reports)
# Secrets loaded from environment variables: SMTP_USER, SMTP_PASSWORD
email:
  enabled: false
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  smtp_use_tls: true
  from_address: ""  # Override with EMAIL_FROM env var
  to_addresses: []  # Override with EMAIL_TO env var (comma-separated)

# Email alerts for urgent tenders
# Secrets loaded from environment variables: SMTP_USER, SMTP_PASSWORD
email_alerts:
  enabled: false  # Set to true to enable urgent tender notifications
  smtp:
    server: "smtp.gmail.com"
    port: 587
    use_tls: true
    sender_email: ""  # Loaded from SMTP_USER env var
    sender_password: ""  # Loaded from SMTP_PASSWORD env var (app-specific password)
    recipients:
      # - "team@mexel.co.za"
  urgent_threshold_days: 3  # Alert for HIGH priority tenders closing within N days
  
# Logging settings
logging:
  level: "INFO"
  max_entries: 5000

# Version
engine_version: "v2.0"

# Phase 1: Multi-channel Alerts (Slack, SMS, Push)
alerts:
  slack:
    enabled: false
    webhook_url: ""  # Add your Slack webhook URL
    channels:
      high_priority: "#tenders-high"
      medium_priority: "#tenders-medium"

  sms:
    enabled: false
    twilio_account_sid: ""  # Add your Twilio Account SID
    twilio_auth_token: ""  # Add your Twilio Auth Token
    from_number: ""  # Add your Twilio phone number
    recipients:
      urgent: []  # Add phone numbers for urgent alerts

  smart_alerts:
    enabled: false  # Auto-selects best channel based on tender priority

  scraper_failures:
    enabled: false  # Alert when 3 consecutive scraper failures
