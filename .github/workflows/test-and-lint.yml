name: Test and Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linting Tools
        run: |
          pip install ruff
      - name: Run Ruff
        run: ruff check . --line-length 120

  dashboard-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Dashboard Dependencies
        working-directory: dashboard
        run: npm ci
      - name: Install Playwright Browser
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Run Dashboard Lint
        working-directory: dashboard
        run: npm run lint
      - name: Run Dashboard Tests
        working-directory: dashboard
        run: npm run test:run
      - name: Audit Dashboard Runtime Dependencies
        working-directory: dashboard
        run: npm audit --omit=dev
      - name: Run Dashboard Smoke Test
        working-directory: dashboard
        run: npm run test:smoke

  python-test:
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Create Dummy .env
        run: |
          cp .env.example .env
          # Use sed without -i extension as it differs between GNU and BSD, 
          # but on Ubuntu (runs-on: ubuntu-latest) GNU sed works fine with -i
          sed -i 's/your-email@gmail.com/test@example.com/g' .env
          sed -i 's/your-app-password/test-password/g' .env
      - name: Audit Python Dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off
      - name: Run Tests
        run: |
          pytest tests/ --cov=. --cov-report=xml
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false
