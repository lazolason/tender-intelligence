name: Update dashboard tenders.json

on:
  workflow_dispatch:
  schedule:
    # 06:05 UTC ~= 08:05 SAST
    - cron: "5 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-dashboard-tenders
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scraper: [municipalities, soes, national_treasury, joburg_water, eskom]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-ml.txt

      - name: Run ${{ matrix.scraper }}
        id: run_scraper
        run: |
          mkdir -p artifacts
          .venv/bin/python tools/scrape_source.py --scraper "${{ matrix.scraper }}" --out "artifacts/${{ matrix.scraper }}.json"
        continue-on-error: true

      - name: Upload scraper artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scrape-${{ matrix.scraper }}
          path: artifacts/${{ matrix.scraper }}.json

  aggregate:
    runs-on: ubuntu-latest
    needs: scrape
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-ml.txt

      - name: Download scrape artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Aggregate and build dashboard snapshot
        id: build_snapshot
        run: |
          set -euo pipefail
          mapfile -t INPUTS < <(find artifacts -type f -name '*.json' 2>/dev/null | sort || true)
          if [ "${#INPUTS[@]}" -gt 0 ]; then
            .venv/bin/python tools/build_dashboard_snapshot.py --inputs "${INPUTS[@]}" --out dashboard/tenders.json --limit 200 --public-dir dashboard/public
          else
            .venv/bin/python tools/build_dashboard_snapshot.py --out dashboard/tenders.json --limit 200 --public-dir dashboard/public
          fi
          .venv/bin/python tools/validate_dashboard_tenders_json.py --path dashboard/tenders.json --summary-path dashboard/public/summary.json

          .venv/bin/python - <<'PY'
          import glob
          import json
          import os

          failing = []
          successful = 0
          for path in glob.glob("artifacts/**/*.json", recursive=True):
              try:
                  with open(path, "r", encoding="utf-8") as file_obj:
                      payload = json.load(file_obj)
                  if isinstance(payload, dict) and payload.get("status") == "success":
                      successful += 1
                  else:
                      failing.append(payload.get("scraper") or os.path.basename(path))
              except Exception:
                  failing.append(os.path.basename(path))

          if successful == 0:
              raise SystemExit("No scraper completed successfully; refusing to publish")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as file_obj:
              file_obj.write(f"has_failures={'true' if failing else 'false'}\n")
              file_obj.write(f"failing={','.join(failing)}\n")
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- dashboard/tenders.json dashboard/public/; then
            echo "No changes to dashboard artifacts"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/tenders.json dashboard/public/
          git commit -m "Auto-update dashboard tenders snapshot"
          git push

      - name: Notify on partial scraper failure
        if: steps.build_snapshot.outputs.has_failures == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          FAILING_SOURCES: ${{ steps.build_snapshot.outputs.failing }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack webhook is not configured; failing sources: $FAILING_SOURCES"
            exit 0
          fi
          payload=$(python -c 'import json, os; print(json.dumps({"text": "Tender scraper partial failure: " + os.environ["FAILING_SOURCES"]}))')
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
